apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backlog-dashboard.fullname" . }}
  labels:
    {{- include "backlog-dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backlog-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollout/restartedAt: {{ randAlphaNum 5 | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "backlog-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backlog-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/backlog
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        - name: NODE_ENV
          value: "production"
        - name: BACKLOGS_CONFIG
          value: "/config/backlogs.yaml"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: cache
          mountPath: /home/nextjs/.cache/backlog/backlog-dashboard
        {{- range .Values.backlog.config.backlogs }}
        - name: {{ .name | lower | replace " " "-" }}
          mountPath: {{ .mountPath }}
          readOnly: true
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "backlog-dashboard.fullname" . }}-config
      - name: cache
        {{- if .Values.persistence.emptyDir }}
        emptyDir: {}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "backlog-dashboard.fullname" . }}-cache
        {{- end }}
      {{- range $idx, $volume := .Values.backlog.volumes }}
      - name: {{ $volume.name }}
        hostPath:
          path: {{ $volume.hostPath.path }}
          type: {{ $volume.hostPath.type | default "Directory" }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
