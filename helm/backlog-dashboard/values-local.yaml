# Local development values
# Use: helm install backlog ./helm/backlog-dashboard -f ./helm/backlog-dashboard/values-local.yaml

replicaCount: 1

image:
  repository: backlog-dashboard
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: NodePort  # Expose via NodePort for local access
  port: 3000

# Local backlog configuration
backlog:
  config:
    backlogs:
      - name: "Glimmer"
        path: "/home/mini/Documents/src/glimmer-project"
        mountPath: "/repos/glimmer-project"
        icon: "/stars@8x.png"
      - name: "Lunar"
        path: "/home/mini/Documents/src/lua/lunar/docs"
        mountPath: "/repos/lunar/docs"
        backlogDir: "features"
        vaultId: "711c1b0e7299620f"
        icon: "/rocket@8x.png"

  # Local volume mounts
  volumes:
    - name: glimmer
      hostPath:
        path: /home/mini/Documents/src/glimmer-project
        type: Directory
    - name: lunar
      hostPath:
        path: /home/mini/Documents/src/lua/lunar/docs
        type: Directory

# Use emptyDir for cache (lightweight for local dev)
persistence:
  enabled: true
  emptyDir: true

# Lower resource limits for local development
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
