# K3s deployment values for backlog.internetisalie.net
# Use: helm install backlog ./helm/backlog-dashboard -f ./helm/backlog-dashboard/values-k3s.yaml

replicaCount: 1

image:
  repository: registry.internetisalie.net/backlog-dashboard
  pullPolicy: Always
  tag: "0.2.2"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Optional: Redirect HTTP to HTTPS
    # traefik.ingress.kubernetes.io/redirect-entry-point: https
    # traefik.ingress.kubernetes.io/redirect-permanent: "true"
  hosts:
    - host: backlog.internetisalie.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: internetisalie-net-fullcert
      hosts:
        - backlog.internetisalie.net

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

# Backlog configuration for k3s node
backlog:
  config:
    backlogs:
      - name: "Glimmer"
        path: "/home/mini/Documents/src/glimmer-project"  # Host path for Obsidian deep-links
        mountPath: "/repos/glimmer-project"  # Container mount path
        vaultId: "74c7f1e2262b3d9b"
        icon: "/stars@8x.png"
      - name: "Lunar"
        path: "/home/mini/Documents/src/lua/lunar/docs"
        mountPath: "/repos/lunar/docs"
        backlogDir: "features"
        vaultId: "711c1b0e7299620f"
        icon: "/rocket@8x.png"
      - name: "Sim"
        path: "/home/mini/Documents/src/sim/docs"
        mountPath: "/repos/sim"
        backlogDir: "features"
        vaultId: "45948c42bac315a5"
        icon: "/stars@8x.png"

  # Volume mounts - ensure these paths exist on k3s node
  volumes:
    - name: glimmer
      hostPath:
        path: /home/mini/Documents/src/glimmer-project
        type: Directory
    - name: lunar
      hostPath:
        path: /home/mini/Documents/src/lua/lunar/docs
        type: Directory
    - name: sim
      hostPath:
        path: /home/mini/Documents/src/sim/docs
        type: Directory


# Use emptyDir for cache (lightweight, regenerated on pod restart)
persistence:
  enabled: true
  emptyDir: true
